name: Anomaly lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -W error anomaly_lab.py --self-test
      - run: python -W error scripts/build_demo.py --check
      - run: node --test tests/browser_engine.test.cjs
